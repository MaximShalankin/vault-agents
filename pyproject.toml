[project]
name = "vault-agents"
version = "0.3.2"
description = "Переиспользуемое ядро памяти проекта: RAG (BM25 + эмбеддинги + RRF), MCP-доступ, temporal KG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "nltk>=3.9",
    "httpx>=0.27",
    "watchdog>=4.0",
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
vault-agents = "vault_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_agents"]

[dependency-groups]
dev = ["pytest>=8.0"]
